# Your Move — CI.
#
# Two gates on every push: the app compiles, and the simulation harness passes. The
# harness needs no database and no API key, because the engine core is pure — which is
# what lets item 14 fail a build on a truth mutation or an invariant violation.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Simulation harness (behavioral · integrity · invariants · determinism · overlay)
        run: npm run test:aw
      - name: Build (type-check + compile)
        run: npm run build
